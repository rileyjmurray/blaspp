# Companion to ilp64-openblas64-demo.yml, but sourcing ILP64 OpenBLAS from
# conda-forge instead of apt. conda-forge ships the ILP64 build via the
# `libopenblas-ilp64` package as `libopenblas64_.so`, built with
# INTERFACE64=1 SYMBOLSUFFIX=64_, so its symbols are `dgemm_64_` (NOT plain
# `dgemm_` like the Debian/Ubuntu libopenblas64-dev case).
#
# This is precisely the convention PR #129 (`blas_symbol_suffix`) targets, so
# the demo shows BOTH sides of the contrast on a stock ubuntu-latest runner:
#   * master            -> automatic detection cannot use libopenblas64_  (FAILS)
#   * feature/blas-... -> `-Dblas_symbol_suffix=64_` links it and builds  (WORKS)
name: ILP64 OpenBLAS (conda-forge libopenblas-ilp64) demo

on:
  workflow_dispatch:
  push:
    branches: [demo/ilp64-openblas64]
    paths: ['.github/workflows/ilp64-openblas64-conda-demo.yml']

defaults:
  run:
    # setup-miniconda needs a login shell so the env is activated per step.
    shell: bash -el {0}

jobs:
  conda-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blaspp (master / this branch)
        uses: actions/checkout@v4

      - name: Checkout PR #129 branch into ./blaspp-pr129
        uses: actions/checkout@v4
        with:
          ref: feature/blas-symbol-suffix
          path: blaspp-pr129

      - name: Set up conda-forge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          activate-environment: ilp64

      - name: Install ILP64 OpenBLAS from conda-forge
        run: |
          # libopenblas-ilp64 provides ONLY the ILP64 libopenblas64_, with no
          # plain libopenblas.so -- the exact situation that defeats blaspp's
          # hardcoded `-lopenblas` probe.
          conda install -y libopenblas-ilp64 cmake
          echo "CONDA_PREFIX=$CONDA_PREFIX"

      - name: Diagnose what conda-forge provides
        run: |
          echo "::group::openblas libraries in the conda prefix"
          ls -l "$CONDA_PREFIX"/lib/libopenblas* || true
          echo "::endgroup::"

          LIB=$(readlink -f "$CONDA_PREFIX"/lib/libopenblas64_.so 2>/dev/null || true)
          echo "Resolved ILP64 library: $LIB"
          echo "LIB=$LIB" >> "$GITHUB_ENV"

          echo "::group::Symbol names (expect suffixed dgemm_64_)"
          nm -D --defined-only "$LIB" 2>/dev/null | grep -iE 'dgemm' | head -20 || true
          echo "::endgroup::"

          echo "::group::Which link names resolve?"
          echo 'int main(void){return 0;}' > /tmp/probe.c
          echo "--- gcc ... -lopenblas    (what BLASFinder's OpenBLAS probe uses) ---"
          gcc /tmp/probe.c -L"$CONDA_PREFIX/lib" -lopenblas    -o /tmp/probe 2>&1 | head -5 || true
          echo "--- gcc ... -lopenblas64_ (the name conda-forge actually ships) ---"
          gcc /tmp/probe.c -L"$CONDA_PREFIX/lib" -lopenblas64_ -o /tmp/probe 2>&1 | head -5 \
            && echo "OK: -lopenblas64_ links cleanly" || true
          echo "::endgroup::"

      - name: "Attempt 1 — master, automatic detection — EXPECTED TO FAIL"
        run: |
          set -o pipefail
          cmake -B build-auto -S . \
            -Dblas=openblas \
            -Dblas_int="int64_t (ILP64)" \
            -Dbuild_tests=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib" \
            --log-level=DEBUG 2>&1 | tee configure-conda-auto.log || true

          echo "==================== VERDICT (master auto) ===================="
          if grep -q "requires a BLAS library and none was found" configure-conda-auto.log; then
            echo "CONFIRMED: master's automatic detection FAILED to find libopenblas64_."
          else
            echo "NOTE: did NOT hit the expected failure — inspect the log."
          fi
          grep -iE "openblas" configure-conda-auto.log | grep -iE "lopenblas|library list|candidate" | head -20 || true

      - name: "Attempt 2 — PR #129 (blas_symbol_suffix=64_) — EXPECTED TO WORK"
        run: |
          set -o pipefail
          cmake -B build-pr129 -S blaspp-pr129 \
            -Dblas=openblas \
            -Dblas_int="int64_t (ILP64)" \
            -Dblas_symbol_suffix=64_ \
            -Dbuild_tests=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib" \
            2>&1 | tee configure-conda-pr129.log || true

          echo "==================== VERDICT (PR #129) ===================="
          if [ -f build-pr129/CMakeCache.txt ] && grep -qiE "BLAS_FOUND.*true|Found BLAS|libopenblas64_" configure-conda-pr129.log; then
            echo "Configure with blas_symbol_suffix=64_ succeeded; building libblaspp..."
            cmake --build build-pr129 -j 2>&1 | tee build-conda-pr129.log | tail -30 || true
            if ls build-pr129/lib*blaspp* >/dev/null 2>&1; then
              echo "CONFIRMED: PR #129 built blaspp against conda-forge's ILP64 libopenblas64_."
              echo "--- libblaspp's link against the ILP64 OpenBLAS: ---"
              ldd build-pr129/lib*blaspp* 2>/dev/null | grep -i openblas || true
            fi
          else
            echo "NOTE: PR #129 configure did not report BLAS found — inspect the log."
          fi

      - name: Upload configure/build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blaspp-ilp64-conda-logs
          path: |
            configure-conda-auto.log
            configure-conda-pr129.log
            build-conda-pr129.log
          if-no-files-found: warn
