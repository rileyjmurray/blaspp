# Shows how PR #129 (feature/blas-symbol-suffix) changes build-ability against
# conda-forge's ILP64 OpenBLAS (libopenblas-ilp64 -> libopenblas64_, symbols
# dgemm_64_), holding the environment fixed and varying ONLY the source tree:
#
#   * master                      -> -Dblas=openblas               (EXPECTED FAIL)
#   * feature/blas-symbol-suffix  -> -Dblas=openblas -Dblas_symbol_suffix=64_ (EXPECTED BUILD)
#
# Unlike the earlier conda demo, this exposes the conda prefix the way blaspp's
# own error message asks for -- via $CPATH / $LIBRARY_PATH / $LD_LIBRARY_PATH --
# so the OpenBLAS search probe can actually resolve -lopenblas64_.
name: PR #129 build-ability vs master (conda-forge ILP64 OpenBLAS)

on:
  workflow_dispatch:
  push:
    branches: [demo/ilp64-openblas64]
    paths: ['.github/workflows/pr129-buildability-conda.yml']

defaults:
  run:
    shell: bash -el {0}

jobs:
  buildability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master into ./blaspp-master
        uses: actions/checkout@v4
        with:
          ref: master
          path: blaspp-master

      - name: Checkout PR #129 branch into ./blaspp-pr129
        uses: actions/checkout@v4
        with:
          ref: feature/blas-symbol-suffix
          path: blaspp-pr129

      - name: Set up conda-forge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          activate-environment: ilp64

      - name: Install ILP64 OpenBLAS from conda-forge
        run: conda install -y libopenblas-ilp64 cmake

      - name: Diagnose + expose the conda prefix to the toolchain
        run: |
          echo "::group::openblas libraries in the conda prefix"
          ls -l "$CONDA_PREFIX"/lib/libopenblas* || true
          echo "::endgroup::"
          echo "Unversioned .so symlink (needed for -lopenblas64_):"
          ls -l "$CONDA_PREFIX"/lib/libopenblas64_.so 2>&1 || echo "  MISSING"
          LIB=$(readlink -f "$CONDA_PREFIX"/lib/libopenblas64_.so 2>/dev/null \
                || ls "$CONDA_PREFIX"/lib/libopenblas64_.so.* 2>/dev/null | head -1)
          echo "Resolved ILP64 library: $LIB"
          echo "::group::Symbols (expect suffixed dgemm_64_)"
          nm -D --defined-only "$LIB" 2>/dev/null | grep -iE 'dgemm' | head -10 || true
          echo "::endgroup::"
          # Expose to all later steps the way blaspp's error message prescribes.
          {
            echo "LIB=$LIB"
            echo "CPATH=$CONDA_PREFIX/include"
            echo "LIBRARY_PATH=$CONDA_PREFIX/lib"
            echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib"
          } >> "$GITHUB_ENV"

      - name: "master — automatic detection — EXPECTED TO FAIL"
        run: |
          set -o pipefail
          cmake -B build-master -S blaspp-master \
            -Dblas=openblas \
            -Dblas_int="int64_t (ILP64)" \
            -Dbuild_tests=OFF \
            --log-level=DEBUG 2>&1 | tee configure-master.log || true
          echo "==================== VERDICT (master) ===================="
          if grep -q "requires a BLAS library and none was found" configure-master.log; then
            echo "CONFIRMED: master cannot build against conda's libopenblas64_."
          else
            echo "NOTE: master did NOT fail as expected — inspect the log."
          fi

      - name: "PR #129 — blas_symbol_suffix=64_ (search) — EXPECTED TO BUILD"
        run: |
          set -o pipefail
          cmake -B build-pr129 -S blaspp-pr129 \
            -Dblas=openblas \
            -Dblas_int="int64_t (ILP64)" \
            -Dblas_symbol_suffix=64_ \
            -Dbuild_tests=OFF \
            --log-level=DEBUG 2>&1 | tee configure-pr129.log || true

          echo "==================== VERDICT (PR #129, search) ===================="
          if [ -f build-pr129/CMakeCache.txt ] \
             && grep -qiE "Found BLAS|BLAS_FOUND.*true|libopenblas64_" configure-pr129.log; then
            echo "Configure succeeded via -lopenblas64_ search; building libblaspp..."
            cmake --build build-pr129 -j 2>&1 | tee build-pr129.log | tail -20 || true
          else
            echo "Search-based configure did not find BLAS; trying explicit BLAS_LIBRARIES fallback..."
            # Fallback proves the suffix *mangling* works even if the search name
            # doesn't resolve (e.g. no unversioned .so symlink).
            cmake -B build-pr129-explicit -S blaspp-pr129 \
              -DBLAS_LIBRARIES="$LIB" \
              -Dblas_int="int64_t (ILP64)" \
              -Dblas_symbol_suffix=64_ \
              -Dbuild_tests=OFF 2>&1 | tee configure-pr129-explicit.log || true
            cmake --build build-pr129-explicit -j 2>&1 | tee build-pr129.log | tail -20 || true
          fi

          echo "==================== RESULT ===================="
          for d in build-pr129 build-pr129-explicit; do
            if ls "$d"/lib*blaspp* >/dev/null 2>&1; then
              echo "CONFIRMED: PR #129 built libblaspp in $d against conda's ILP64 OpenBLAS."
              echo "--- its link against libopenblas64_: ---"
              ldd "$d"/lib*blaspp* 2>/dev/null | grep -i openblas || true
            fi
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr129-buildability-conda-logs
          path: |
            configure-master.log
            configure-pr129.log
            configure-pr129-explicit.log
            build-pr129.log
          if-no-files-found: warn
