# Shows how PR #129 (feature/blas-symbol-suffix) changes build-ability against
# conda-forge's ILP64 OpenBLAS (libopenblas-ilp64 -> libopenblas64_, symbols
# dgemm_64_), holding the environment fixed and varying ONLY the source tree:
#
#   * master                      -> -Dblas=openblas               (EXPECTED FAIL)
#   * feature/blas-symbol-suffix  -> -Dblas=openblas -Dblas_symbol_suffix=64_ (EXPECTED BUILD)
#
# Findings that shaped this workflow:
#   - conda's libopenblas-ilp64 *runtime* package ships only the versioned
#     libopenblas64_.so.0; there is no unversioned libopenblas64_.so, so a bare
#     `-lopenblas64_` cannot link. A conda *build* env (e.g. the conda-forge
#     blaspp feedstock) has that dev symlink; we recreate it for the search test.
#   - The build uses the conda compiler toolchain ($CXX) so conda's OpenBLAS and
#     its deps resolve the way the feedstock builds.
name: PR #129 build-ability vs master (conda-forge ILP64 OpenBLAS)

on:
  workflow_dispatch:
  push:
    branches: [demo/ilp64-openblas64]
    paths: ['.github/workflows/pr129-buildability-conda.yml']

defaults:
  run:
    shell: bash -el {0}

jobs:
  buildability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master into ./blaspp-master
        uses: actions/checkout@v4
        with:
          ref: master
          path: blaspp-master

      - name: Checkout PR #129 branch into ./blaspp-pr129
        uses: actions/checkout@v4
        with:
          ref: feature/blas-symbol-suffix
          path: blaspp-pr129

      - name: Set up conda-forge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          activate-environment: ilp64

      - name: Install ILP64 OpenBLAS + conda compiler toolchain
        run: conda install -y libopenblas-ilp64 cmake cxx-compiler

      - name: Diagnose + direct-link probe (ground-truth linker error)
        run: |
          set +e   # this step probes things that are *expected* to fail
          echo "CXX=$CXX"; "$CXX" --version | head -1

          echo "::group::openblas + gfortran libraries in the conda prefix"
          ls -l "$CONDA_PREFIX"/lib/libopenblas64_* "$CONDA_PREFIX"/lib/libgfortran* 2>&1
          echo "::endgroup::"

          # The runtime package has only libopenblas64_.so.0 (no unversioned .so).
          LIB="$CONDA_PREFIX/lib/libopenblas64_.so.0"
          echo "ILP64 library (full path, exists): $LIB -> $(readlink -f "$LIB")"

          echo "::group::NEEDED (transitive deps) of libopenblas64_"
          objdump -p "$LIB" | grep NEEDED
          echo "::endgroup::"
          echo "::group::Symbols (expect suffixed dgemm_64_)"
          nm -D --defined-only "$LIB" | grep -iE 'dgemm' | head -10
          echo "::endgroup::"

          echo "::group::Direct-link probes with conda \$CXX"
          printf 'int main(){return 0;}\n' > /tmp/h.cc
          echo "--- bare search -lopenblas64_ (expected: no such .so symlink) ---"
          "$CXX" /tmp/h.cc -lopenblas64_ -o /tmp/h; echo "exit=$?"
          echo "--- full path $LIB (expected: links) ---"
          "$CXX" /tmp/h.cc "$LIB" -o /tmp/h2; echo "exit=$?"
          echo "::endgroup::"

          # Recreate the unversioned dev symlink a conda build env would have,
          # so the PR #129 -lopenblas64_ search can resolve.
          ln -sf libopenblas64_.so.0 "$CONDA_PREFIX/lib/libopenblas64_.so"
          echo "Created dev symlink: $(ls -l "$CONDA_PREFIX"/lib/libopenblas64_.so)"
          echo "--- bare search -lopenblas64_ after creating .so symlink ---"
          "$CXX" /tmp/h.cc -lopenblas64_ -o /tmp/h3; echo "exit=$?"

          {
            echo "LIB=$LIB"
            echo "CPATH=$CONDA_PREFIX/include"
            echo "LIBRARY_PATH=$CONDA_PREFIX/lib"
            echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib"
          } >> "$GITHUB_ENV"

      - name: "master — automatic detection — EXPECTED TO FAIL"
        run: |
          set -o pipefail
          cmake -B build-master -S blaspp-master \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -Dblas=openblas \
            -Dblas_int="int64_t (ILP64)" \
            -Dbuild_tests=OFF \
            --log-level=DEBUG 2>&1 | tee configure-master.log || true
          echo "==================== VERDICT (master) ===================="
          if grep -q "requires a BLAS library and none was found" configure-master.log; then
            echo "CONFIRMED: master cannot auto-detect conda's libopenblas64_."
          else
            echo "NOTE: master did NOT fail as expected — inspect the log."
          fi

      - name: "PR #129 — explicit full-path + blas_symbol_suffix=64_ — EXPECTED TO BUILD"
        run: |
          set -o pipefail
          RPATH="-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib -Wl,-rpath-link,$CONDA_PREFIX/lib"
          cmake -B build-explicit -S blaspp-pr129 \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_EXE_LINKER_FLAGS="$RPATH" \
            -DBLAS_LIBRARIES="$LIB" \
            -Dblas_int="int64_t (ILP64)" \
            -Dblas_symbol_suffix=64_ \
            -Dbuild_tests=OFF 2>&1 | tee configure-explicit.log || true
          cmake --build build-explicit -j 2>&1 | tee build-explicit.log | tail -20 || true

      - name: "PR #129 — automatic search -lopenblas64_ + suffix — EXPECTED TO BUILD"
        run: |
          set -o pipefail
          RPATH="-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib -Wl,-rpath-link,$CONDA_PREFIX/lib"
          cmake -B build-search -S blaspp-pr129 \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_EXE_LINKER_FLAGS="$RPATH" \
            -Dblas=openblas \
            -Dblas_int="int64_t (ILP64)" \
            -Dblas_symbol_suffix=64_ \
            -Dbuild_tests=OFF \
            --log-level=DEBUG 2>&1 | tee configure-search.log || true
          cmake --build build-search -j 2>&1 | tee build-search.log | tail -20 || true

          echo "==================== RESULT (PR #129) ===================="
          for d in build-explicit build-search; do
            if ls "$d"/lib*blaspp* >/dev/null 2>&1; then
              echo "CONFIRMED: PR #129 built libblaspp in $d against conda's ILP64 OpenBLAS."
              ldd "$d"/lib*blaspp* 2>/dev/null | grep -i openblas || true
            else
              echo "NOTE: no libblaspp produced in $d — inspect the log."
            fi
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr129-buildability-conda-logs
          path: |
            configure-master.log
            configure-explicit.log
            build-explicit.log
            configure-search.log
            build-search.log
          if-no-files-found: warn
