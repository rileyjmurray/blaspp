# Produces self-describing logs for the ILP64-OpenBLAS issue, each backing exactly
# one claim. CMake (01-05) end in a FATAL_ERROR or `Built target blaspp`; the
# Make/configure.py logs (06-07) end in a non-zero configure.py exit. 08-09 test
# Mark's suggestion: route through CMake's own FindBLAS via BLA_VENDOR.
#
#   01-apt-master-FAILS.log         CMake master + apt libopenblas64-dev, auto    -> FAILS
#   02-apt-bylib-WORKS.log          CMake master + apt, library given by path     -> BUILDS
#   03-conda-master-FAILS.log       CMake master + conda libopenblas-ilp64, auto  -> FAILS
#   04-conda-bylib-master-FAILS.log CMake master + conda, BLAS_LIBRARIES correct  -> FAILS (suffix)
#   05-conda-pr129-WORKS.log        CMake PR #129 + conda, blas_symbol_suffix=64_ -> BUILDS
#   06-make-apt-configure-FAILS.log Make configure.py + apt libopenblas64-dev     -> FAILS
#   07-make-conda-configure-FAILS.log Make configure.py + conda libopenblas-ilp64 -> FAILS
#   08-apt-blavendor.log            CMake master + apt, BLA_VENDOR=OpenBLAS        -> (test)
#   09-conda-blavendor.log          CMake master + conda, BLA_VENDOR=OpenBLAS      -> (test)
#
# CMake configures pass -Dcolor=OFF so the logs are plain text (no ANSI codes).
name: ILP64 OpenBLAS evidence

on:
  workflow_dispatch:
  push:
    branches: [demo/ilp64-openblas64]
    paths: ['.github/workflows/ilp64-evidence.yml']

defaults:
  run:
    shell: bash -el {0}

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master into ./blaspp-master
        uses: actions/checkout@v4
        with: { ref: master, path: blaspp-master }

      - name: Checkout PR #129 branch into ./blaspp-pr129
        uses: actions/checkout@v4
        with: { ref: feature/blas-symbol-suffix, path: blaspp-pr129 }

      # ---------------------------------------------------------------- apt
      - name: Install apt ILP64 OpenBLAS (system toolchain)
        run: sudo apt-get update && sudo apt-get install -y libopenblas64-dev cmake g++ binutils

      - name: "01 — master + apt, auto-detect (EXPECT FAIL)"
        run: |
          set +e
          {
            echo "CLAIM 1: blaspp master cannot auto-detect Ubuntu's ILP64 OpenBLAS."
            echo "ENV    : stock ubuntu-latest, apt libopenblas64-dev only, system g++."
            echo "RUN    : cmake -Dblas=openblas -Dblas_int='int64_t (ILP64)'  (blaspp master)"
            echo "EXPECT : FATAL_ERROR — only -lopenblas is probed, but the lib is libopenblas64."
            echo "================================================================"
          } > 01-apt-master-FAILS.log
          cmake -B b01 -S blaspp-master -Dblas=openblas -Dblas_int="int64_t (ILP64)" \
            -Dbuild_tests=OFF -Dcolor=OFF >> 01-apt-master-FAILS.log 2>&1; rc=$?
          echo "----------------------------------------------------------------" >> 01-apt-master-FAILS.log
          echo "cmake exit code: $rc  (non-zero = configure failed, as claimed)"  >> 01-apt-master-FAILS.log

      - name: "02 — master + apt, library by path (EXPECT BUILD)"
        run: |
          set +e
          LIBA=$(ldconfig -p | grep -m1 'libopenblas64\.so' | awk '{print $NF}')
          {
            echo "CLAIM 2: The failure in claim 1 is only the hardcoded link NAME."
            echo "         Given the same .so by path, master configures and BUILDS,"
            echo "         which also shows Ubuntu's libopenblas64 has standard dgemm_ symbols."
            echo "ENV    : stock ubuntu-latest, apt libopenblas64-dev only, system g++."
            echo "RUN    : cmake -DBLAS_LIBRARIES=$LIBA -Dblas_int='int64_t (ILP64)'  (master)"
            echo "EXPECT : configure done, then [100%] Built target blaspp."
            echo "================================================================"
          } > 02-apt-bylib-WORKS.log
          cmake -B b02 -S blaspp-master -DBLAS_LIBRARIES="$LIBA" -Dblas_int="int64_t (ILP64)" \
            -Dbuild_tests=OFF -Dcolor=OFF >> 02-apt-bylib-WORKS.log 2>&1
          cmake --build b02 -j >> 02-apt-bylib-WORKS.log 2>&1
          echo "----------------------------------------------------------------" >> 02-apt-bylib-WORKS.log
          ls b02/lib*blaspp* >> 02-apt-bylib-WORKS.log 2>&1

      - name: "06 — Make build + apt, configure.py auto-detect (EXPECT FAIL)"
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/06-make-apt-configure-FAILS.log"
          {
            echo "CLAIM 6: The limitation is NOT CMake-specific. blaspp's Make/configure.py"
            echo "         build detects BLAS in config/lapack.py, which also hardcodes -lopenblas"
            echo "         (line 321), so it can't auto-detect Ubuntu's ILP64 OpenBLAS either."
            echo "ENV    : stock ubuntu-latest, apt libopenblas64-dev only, system g++."
            echo "RUN    : python3 configure.py blas=openblas blas_int=int64  (blaspp master, Make build)"
            echo "EXPECT : 'none found' / 'BLAS++ could not be configured', non-zero exit."
            echo "================================================================"
          } > "$LOG"
          ( cd blaspp-master && python3 configure.py blas=openblas blas_int=int64 ) >> "$LOG" 2>&1; rc=$?
          echo "----------------------------------------------------------------" >> "$LOG"
          echo "configure.py exit code: $rc  (non-zero = configure failed, as claimed)" >> "$LOG"

      - name: "08 — master + apt, BLA_VENDOR=OpenBLAS (Mark's suggestion)"
        run: |
          set +e
          {
            echo "CLAIM 8: Testing Mark's suggestion — does CMake's own FindBLAS (reached via"
            echo "         BLA_VENDOR) locate Ubuntu's ILP64 OpenBLAS where blaspp's search could"
            echo "         not (claim 1)?  Setting BLA_VENDOR routes blaspp to find_package(BLAS)."
            echo "ENV    : stock ubuntu-latest, apt libopenblas64-dev only, system g++."
            echo "RUN    : cmake -DBLA_VENDOR=OpenBLAS -DBLA_SIZEOF_INTEGER=8 -Dblas_int='int64_t (ILP64)'  (master)"
            echo "         BLA_SIZEOF_INTEGER=8 asks CMake FindBLAS for the 64-bit interface (it"
            echo "         appends a '64' library-name variant)."
            echo "EXPECT : likely BUILDS — if FindBLAS finds -lopenblas64, apt's plain dgemm_ symbols"
            echo "         satisfy blaspp's binding check. The apt name problem is solvable this way."
            echo "================================================================"
          } > 08-apt-blavendor.log
          cmake -B b08 -S blaspp-master -DBLA_VENDOR=OpenBLAS -DBLA_SIZEOF_INTEGER=8 \
            -Dblas_int="int64_t (ILP64)" -Dbuild_tests=OFF -Dcolor=OFF >> 08-apt-blavendor.log 2>&1; rc=$?
          if [ $rc -eq 0 ]; then cmake --build b08 -j >> 08-apt-blavendor.log 2>&1; rc=$?; fi
          echo "----------------------------------------------------------------" >> 08-apt-blavendor.log
          echo "cmake exit code: $rc  (0 = configured/built; non-zero = failed)"  >> 08-apt-blavendor.log
          ls b08/lib*blaspp* >> 08-apt-blavendor.log 2>&1

      # -------------------------------------------------------------- conda
      - name: Set up conda-forge
        uses: conda-incubator/setup-miniconda@v3
        with: { miniforge-version: latest, channels: conda-forge, channel-priority: strict, activate-environment: ilp64 }

      - name: Install conda ILP64 OpenBLAS + conda toolchain
        run: conda install -y libopenblas-ilp64 cmake cxx-compiler

      - name: "03 — master + conda, auto-detect (EXPECT FAIL)"
        run: |
          set +e
          {
            echo "CLAIM 3: blaspp master also cannot auto-detect conda-forge's ILP64 OpenBLAS."
            echo "ENV    : conda-forge libopenblas-ilp64 (libopenblas64_, symbols dgemm_64_), conda g++."
            echo "RUN    : cmake -Dblas=openblas -Dblas_int='int64_t (ILP64)'  (blaspp master)"
            echo "EXPECT : FATAL_ERROR — only -lopenblas is probed."
            echo "================================================================"
          } > 03-conda-master-FAILS.log
          cmake -B b03 -S blaspp-master -DCMAKE_CXX_COMPILER="$CXX" \
            -Dblas=openblas -Dblas_int="int64_t (ILP64)" \
            -Dbuild_tests=OFF -Dcolor=OFF >> 03-conda-master-FAILS.log 2>&1; rc=$?
          echo "----------------------------------------------------------------" >> 03-conda-master-FAILS.log
          echo "cmake exit code: $rc  (non-zero = configure failed, as claimed)"  >> 03-conda-master-FAILS.log

      - name: "04 — master + conda, BLAS_LIBRARIES set correctly (EXPECT FAIL: symbol suffix)"
        run: |
          set +e
          export CPATH="$CONDA_PREFIX/include" LIBRARY_PATH="$CONDA_PREFIX/lib" LD_LIBRARY_PATH="$CONDA_PREFIX/lib"
          RPATH="-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib -Wl,-rpath-link,$CONDA_PREFIX/lib"
          LIBC="$CONDA_PREFIX/lib/libopenblas64_.so.0"
          {
            echo "CLAIM 4: Unlike apt (claim 2), pointing master at conda's ILP64 OpenBLAS"
            echo "         by path does NOT work — so there is no blaspp-free workaround."
            echo "ENV    : conda-forge libopenblas-ilp64 (symbols are dgemm_64_), conda g++."
            echo "RUN    : cmake -DBLAS_LIBRARIES=$LIBC -Dblas_int='int64_t (ILP64)'  (blaspp master)"
            echo "EXPECT : FAIL — master mangles to dgemm_, but the library only exports"
            echo "         dgemm_64_, so the BLAS routine probe doesn't link ('routine not found')."
            echo "================================================================"
          } > 04-conda-bylib-master-FAILS.log
          cmake -B b04 -S blaspp-master -DCMAKE_CXX_COMPILER="$CXX" -DCMAKE_EXE_LINKER_FLAGS="$RPATH" \
            -DBLAS_LIBRARIES="$LIBC" -Dblas_int="int64_t (ILP64)" \
            -Dbuild_tests=OFF -Dcolor=OFF >> 04-conda-bylib-master-FAILS.log 2>&1; rc=$?
          echo "----------------------------------------------------------------" >> 04-conda-bylib-master-FAILS.log
          echo "cmake exit code: $rc  (non-zero = configure failed, as claimed)"  >> 04-conda-bylib-master-FAILS.log

      - name: "05 — PR #129 + conda, blas_symbol_suffix=64_ (EXPECT BUILD)"
        run: |
          set +e
          # conda's runtime libopenblas-ilp64 ships only libopenblas64_.so.0; a
          # build/dev env (e.g. the conda-forge feedstock) also has the unversioned
          # .so that -lopenblas64_ needs, so recreate it here.
          ln -sf libopenblas64_.so.0 "$CONDA_PREFIX/lib/libopenblas64_.so"
          export CPATH="$CONDA_PREFIX/include" LIBRARY_PATH="$CONDA_PREFIX/lib" LD_LIBRARY_PATH="$CONDA_PREFIX/lib"
          RPATH="-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib -Wl,-rpath-link,$CONDA_PREFIX/lib"
          {
            echo "CLAIM 5: PR #129's blas_symbol_suffix=64_ lets the SAME auto-detect"
            echo "         invocation find and BUILD against conda-forge's libopenblas64_."
            echo "ENV    : conda-forge libopenblas-ilp64, conda g++ (dev .so symlink recreated)."
            echo "RUN    : cmake -Dblas=openblas -Dblas_int='int64_t (ILP64)' -Dblas_symbol_suffix=64_  (PR #129)"
            echo "EXPECT : Found BLAS library: -lopenblas64_, then [100%] Built target blaspp."
            echo "================================================================"
          } > 05-conda-pr129-WORKS.log
          cmake -B b05 -S blaspp-pr129 -DCMAKE_CXX_COMPILER="$CXX" -DCMAKE_EXE_LINKER_FLAGS="$RPATH" \
            -Dblas=openblas -Dblas_int="int64_t (ILP64)" -Dblas_symbol_suffix=64_ \
            -Dbuild_tests=OFF -Dcolor=OFF >> 05-conda-pr129-WORKS.log 2>&1
          cmake --build b05 -j >> 05-conda-pr129-WORKS.log 2>&1
          echo "----------------------------------------------------------------" >> 05-conda-pr129-WORKS.log
          ls b05/lib*blaspp* >> 05-conda-pr129-WORKS.log 2>&1

      - name: "07 — Make build + conda, configure.py auto-detect (EXPECT FAIL)"
        run: |
          set +e
          export CXX="$CXX" CPATH="$CONDA_PREFIX/include" LIBRARY_PATH="$CONDA_PREFIX/lib" LD_LIBRARY_PATH="$CONDA_PREFIX/lib"
          LOG="$GITHUB_WORKSPACE/07-make-conda-configure-FAILS.log"
          {
            echo "CLAIM 7: The Make build also can't auto-detect conda-forge's ILP64 OpenBLAS."
            echo "ENV    : conda-forge libopenblas-ilp64 (libopenblas64_, dgemm_64_), conda g++."
            echo "RUN    : python3 configure.py blas=openblas blas_int=int64  (blaspp master, Make build)"
            echo "EXPECT : 'none found' / 'BLAS++ could not be configured', non-zero exit."
            echo "NOTE   : config/lapack.py has no symbol-suffix option and PR #129 did not touch"
            echo "         the Make build, so even forcing the lib would mangle to dgemm_ and fail."
            echo "================================================================"
          } > "$LOG"
          ( cd blaspp-master && python3 configure.py blas=openblas blas_int=int64 ) >> "$LOG" 2>&1; rc=$?
          echo "----------------------------------------------------------------" >> "$LOG"
          echo "configure.py exit code: $rc  (non-zero = configure failed, as claimed)" >> "$LOG"

      - name: "09 — master + conda, BLA_VENDOR=OpenBLAS (Mark's suggestion)"
        run: |
          set +e
          # conda's runtime libopenblas-ilp64 ships only libopenblas64_.so.0; recreate
          # the unversioned .so so CMake FindBLAS can match the name at all (see step 05).
          ln -sf libopenblas64_.so.0 "$CONDA_PREFIX/lib/libopenblas64_.so"
          export CPATH="$CONDA_PREFIX/include" LIBRARY_PATH="$CONDA_PREFIX/lib" LD_LIBRARY_PATH="$CONDA_PREFIX/lib"
          RPATH="-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib -Wl,-rpath-link,$CONDA_PREFIX/lib"
          {
            echo "CLAIM 9: BLA_VENDOR does NOT rescue the conda case. Even routed through CMake's"
            echo "         own FindBLAS, conda's lib is libopenblas64_ exporting dgemm_64_ symbols."
            echo "ENV    : conda-forge libopenblas-ilp64, conda g++ (dev .so symlink recreated)."
            echo "RUN    : cmake -DBLA_VENDOR=OpenBLAS -DBLA_SIZEOF_INTEGER=8 -Dblas_int='int64_t (ILP64)'  (master)"
            echo "EXPECT : FAIL — CMake FindBLAS either won't match the 'libopenblas64_' name, or if it"
            echo "         does, blaspp's probe mangles to dgemm_ and won't link the dgemm_64_ symbols."
            echo "         Either way, BLA_VENDOR is no substitute for PR #129's symbol-suffix handling."
            echo "================================================================"
          } > 09-conda-blavendor.log
          cmake -B b09 -S blaspp-master -DCMAKE_CXX_COMPILER="$CXX" -DCMAKE_EXE_LINKER_FLAGS="$RPATH" \
            -DBLA_VENDOR=OpenBLAS -DBLA_SIZEOF_INTEGER=8 -Dblas_int="int64_t (ILP64)" \
            -Dbuild_tests=OFF -Dcolor=OFF >> 09-conda-blavendor.log 2>&1; rc=$?
          if [ $rc -eq 0 ]; then cmake --build b09 -j >> 09-conda-blavendor.log 2>&1; rc=$?; fi
          echo "----------------------------------------------------------------" >> 09-conda-blavendor.log
          echo "cmake exit code: $rc  (non-zero = failed, as claimed)"  >> 09-conda-blavendor.log
          ls b09/lib*blaspp* >> 09-conda-blavendor.log 2>&1

      - name: Summary (console pass/fail at a glance)
        if: always()
        run: |
          for f in 01-apt-master-FAILS 02-apt-bylib-WORKS 03-conda-master-FAILS 04-conda-bylib-master-FAILS 05-conda-pr129-WORKS 06-make-apt-configure-FAILS 07-make-conda-configure-FAILS 08-apt-blavendor 09-conda-blavendor; do
            echo "===== $f.log ====="
            grep -E "requires a BLAS library and none was found|routine not found|could not be configured|none found|Built target blaspp|Found BLAS library|Found BLAS:|Using CMake's FindBLAS" "$f.log" || echo "(marker not found)"
          done

      - name: Upload the evidence logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ilp64-evidence
          path: |
            01-apt-master-FAILS.log
            02-apt-bylib-WORKS.log
            03-conda-master-FAILS.log
            04-conda-bylib-master-FAILS.log
            05-conda-pr129-WORKS.log
            06-make-apt-configure-FAILS.log
            07-make-conda-configure-FAILS.log
            08-apt-blavendor.log
            09-conda-blavendor.log
          if-no-files-found: warn
